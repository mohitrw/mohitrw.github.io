<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Mohit Portfolio</title>
  <meta name="description"
    content="The page you are looking for could not be found. Return to Mohit's UI/UX & Web Design portfolio homepage.">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#161616">

  <!-- Google Fonts: Roboto Mono, Anonymous Pro, Caveat -->
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Anonymous+Pro:wght@400;700&family=Caveat:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;700&display=swap"
    rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">

  <style>
    .error-page-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      background-color: var(--color-hero-base, #161616);
      overflow: hidden;
    }

    .error-content {
      position: relative;
      z-index: 10;
      max-width: 1440px;
      margin: auto auto;
      padding: 120px var(--hero-px) 60px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 1.5rem;
    }

    .error-code {
      font-family: var(--font-display);
      font-size: clamp(4rem, 12vw, 120px);
      font-weight: 700;
      color: var(--color-text-secondary, #878787);
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .error-code .code-accent {
      color: var(--color-text-white, #FFFFFF);
      border-bottom: 4px solid var(--color-text-white, #FFFFFF);
      padding-bottom: 4px;
      display: inline-block;
    }

    .error-title {
      font-family: var(--font-display);
      font-size: clamp(1.5rem, 3vw, 32px);
      font-weight: 700;
      color: var(--color-text-white, #FFFFFF);
      margin: 0;
    }

    .error-description {
      font-family: var(--font-body);
      font-size: clamp(15px, 1.4vw, 18px);
      color: var(--color-text-secondary, #878787);
      max-width: 540px;
      line-height: 1.6;
      margin: 0;
    }

    .error-action-btn {
      margin-top: 1rem;
      background-color: var(--color-card-gray, #7F7F7F);
      color: var(--color-hero-base, #161616);
      font-family: var(--font-body);
      font-size: 16px;
      font-weight: 700;
      padding: 12px 28px;
      border-radius: 24px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      transition: background-color 0.25s ease, transform 0.2s ease, box-shadow 0.25s ease;
    }

    .error-action-btn:hover,
    .error-action-btn:focus-visible {
      background-color: var(--color-text-white, #FFFFFF);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }
  </style>
</head>

<body>

  <!-- Skip to Content -->
  <a href="#main-error" class="skip-link">Skip to main content</a>

  <!-- Top Fixed Navigation Bar -->
  <nav class="nav-bar" aria-label="Main Navigation">
    <div class="nav-container">
      <a href="/" class="brand-logo" aria-label="Mohit — Home">
        <img src="Assets/logo.svg" alt="Mohit — UI/UX & Web Designer" class="logo-img" width="52" height="38">
      </a>
      <div class="desktop-nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="ui-elements.html" class="nav-link nav-link-canvas" aria-label="Interactive Canvas">Ca<span class="nav-canvas-dim">nva</span>s</a>
        <a href="about.html" class="nav-link">AboutMe</a>
        <a href="index.html#contact" class="nav-link">Contact</a>
      </div>
    </div>
  </nav>

  <div class="error-page-wrapper">
    <!-- Geometric Background Lines Overlay -->
    <div class="hero-bg-overlay" aria-hidden="true">
      <svg class="bg-diagonal-svg" viewBox="0 0 1440 820" preserveAspectRatio="none" fill="none"
        xmlns="http://www.w3.org/2000/svg">
        <line x1="80" y1="0" x2="1180" y2="820" stroke="#292929" stroke-width="1.2" />
        <line x1="400" y1="820" x2="1180" y2="0" stroke="#292929" stroke-width="1.2" />
        <line x1="0" y1="520" x2="880" y2="0" stroke="#222222" stroke-width="1" />
      </svg>
    </div>

    <!-- Main Landmark Error Content -->
    <main class="error-content" id="main-error">
      <div class="error-code">4<span class="code-accent">0</span>4</div>
      <h1 class="error-title">Page Not Found</h1>
      <p class="error-description">
        The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
      </p>
      <a href="/" class="error-action-btn">
        <span>← Back to Home</span>
      </a>
    </main>
  </div>

</body>

</html>
